name: Build Android APK with Full Alarm Support

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecutar manualmente

env:
  NODE_VERSION: 20
  JAVA_VERSION: 17
  ANDROID_SDK_ROOT: /usr/local/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout del código
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 3. Configurar Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      # 4. Configurar Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Instalar dependencias del proyecto
      - name: Install dependencies
        run: |
          npm ci --prefer-offline
          npm install -D typescript @capacitor/core @capacitor/cli @capacitor/android

      # 6. Construir la aplicación web
      - name: Build web app
        run: |
          if [ -f "package.json" ]; then
            npm run build || npm run build:prod || echo "No build script found"
          fi

      # 7. Sincronizar Capacitor
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 8. Crear estructura de directorios para código Java
      - name: Create Java directories
        run: |
          mkdir -p android/app/src/main/java/com/example/app/
          mkdir -p android/app/src/main/res/values/

      # 9. Configurar AndroidManifest.xml completo
      - name: Configure AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.app">
          
              <!-- Permisos para alarmas -->
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_ALARM" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              
              <!-- Permisos para Android 13+ -->
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" 
                  android:maxSdkVersion="32" />
          
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">
          
                  <!-- Activity principal -->
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:launchMode="singleTask"
                      android:theme="@style/AppTheme.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <!-- Receiver para alarmas -->
                  <receiver 
                      android:name=".AlarmReceiver" 
                      android:exported="true" />
                  
                  <!-- Receiver para boot completado -->
                  <receiver 
                      android:name=".BootReceiver" 
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
          
                  <!-- Service para alarmas foreground -->
                  <service 
                      android:name=".AlarmService" 
                      android:exported="false" 
                      android:foregroundServiceType="alarm" />
          
                  <!-- Service para media (opcional) -->
                  <service 
                      android:name=".MediaPlayerService" 
                      android:exported="false" 
                      android:foregroundServiceType="mediaPlayback" />
          
                  <!-- Provider para archivos (si es necesario) -->
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
          
              </application>
          
          </manifest>
          EOF

      # 10. Crear MainActivity.java completo
      - name: Create MainActivity
        run: |
          cat > android/app/src/main/java/com/example/app/MainActivity.java << 'EOF'
          package com.example.app;
          
          import android.Manifest;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.Log;
          import android.widget.Toast;
          
          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          
          import com.getcapacitor.BridgeActivity;
          
          public class MainActivity extends BridgeActivity {
              private static final String TAG = "MainActivity";
              private static final int REQUEST_CODE_PERMISSIONS = 1001;
              
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // Crear canal de notificaciones
                  createNotificationChannel();
                  
                  // Verificar y solicitar permisos
                  checkAndRequestPermissions();
                  
                  // Configurar alarmas si es necesario
                  setupAlarms();
              }
              
              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      
                      // Canal para alarmas
                      NotificationChannel alarmChannel = new NotificationChannel(
                          "alarm_channel",
                          "Alarm Channel",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      alarmChannel.setDescription("Canal para notificaciones de alarmas");
                      alarmChannel.enableVibration(true);
                      alarmChannel.setVibrationPattern(new long[]{0, 1000, 500, 1000});
                      manager.createNotificationChannel(alarmChannel);
                      
                      // Canal para música/audio
                      NotificationChannel musicChannel = new NotificationChannel(
                          "music_channel",
                          "Music Channel",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      musicChannel.setDescription("Canal para reproducción de música");
                      manager.createNotificationChannel(musicChannel);
                      
                      Log.d(TAG, "Canales de notificación creados");
                  }
              }
              
              private void checkAndRequestPermissions() {
                  String[] permissions = {
                      Manifest.permission.SCHEDULE_EXACT_ALARM,
                      Manifest.permission.POST_NOTIFICATIONS,
                      Manifest.permission.VIBRATE,
                      Manifest.permission.WAKE_LOCK
                  };
                  
                  // Para Android 13+ pedir POST_NOTIFICATIONS
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) 
                          != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, 
                              new String[]{Manifest.permission.POST_NOTIFICATIONS}, 
                              REQUEST_CODE_PERMISSIONS);
                      }
                  }
                  
                  // Para alarmas exactas en Android 12+
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      if (!((AlarmManager) getSystemService(ALARM_SERVICE)).canScheduleExactAlarms()) {
                          // Redirigir a configuración de alarmas
                          Intent intent = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM);
                          startActivity(intent);
                      }
                  }
              }
              
              private void setupAlarms() {
                  // Configurar alarmas guardadas
                  AlarmHelper.restoreAlarms(this);
              }
              
              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, 
                                                     @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  
                  if (requestCode == REQUEST_CODE_PERMISSIONS) {
                      for (int i = 0; i < permissions.length; i++) {
                          if (grantResults[i] == PackageManager.PERMISSION_GRANTED) {
                              Log.d(TAG, "Permiso concedido: " + permissions[i]);
                          } else {
                              Log.w(TAG, "Permiso denegado: " + permissions[i]);
                          }
                      }
                  }
              }
          }
          EOF

      # 11. Crear AlarmReceiver.java
      - name: Create AlarmReceiver
        run: |
          cat > android/app/src/main/java/com/example/app/AlarmReceiver.java << 'EOF'
          package com.example.app;
          
          import android.app.Notification;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.Ringtone;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.util.Log;
          
          import androidx.core.app.NotificationCompat;
          
          public class AlarmReceiver extends BroadcastReceiver {
              private static final String TAG = "AlarmReceiver";
              private static final int NOTIFICATION_ID = 1001;
              
              @Override
              public void onReceive(Context context, Intent intent) {
                  Log.d(TAG, "Alarma recibida!");
                  
                  // Obtener wake lock para mantener el dispositivo activo
                  PowerManager powerManager = (PowerManager) context.getSystemService(Context.POWER_SERVICE);
                  PowerManager.WakeLock wakeLock = powerManager.newWakeLock(
                      PowerManager.PARTIAL_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP,
                      "AlarmWakeLock"
                  );
                  wakeLock.acquire(10 * 60 * 1000L); // 10 minutos
                  
                  // Iniciar servicio foreground
                  Intent serviceIntent = new Intent(context, AlarmService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.startForegroundService(serviceIntent);
                  } else {
                      context.startService(serviceIntent);
                  }
                  
                  // Mostrar notificación
                  showNotification(context);
                  
                  // Vibrar
                  vibrate(context);
                  
                  // Reproducir sonido
                  playSound(context);
                  
                  // Liberar wake lock después de un tiempo
                  new android.os.Handler().postDelayed(() -> {
                      if (wakeLock.isHeld()) {
                          wakeLock.release();
                      }
                  }, 5000);
              }
              
              private void showNotification(Context context) {
                  Intent intent = new Intent(context, MainActivity.class);
                  intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                  PendingIntent pendingIntent = PendingIntent.getActivity(
                      context, 0, intent, 
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
                  
                  Notification notification = new NotificationCompat.Builder(context, "alarm_channel")
                      .setContentTitle("⏰ Alarma")
                      .setContentText("¡Es hora de tu alarma!")
                      .setSmallIcon(android.R.drawable.ic_lock_alarm)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setFullScreenIntent(pendingIntent, true)
                      .addAction(android.R.drawable.ic_media_pause, "Dormir", null)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Cancelar", null)
                      .setAutoCancel(true)
                      .build();
                  
                  NotificationManager manager = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  manager.notify(NOTIFICATION_ID, notification);
              }
              
              private void vibrate(Context context) {
                  Vibrator vibrator = (Vibrator) context.getSystemService(Context.VIBRATOR_SERVICE);
                  if (vibrator != null && vibrator.hasVibrator()) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator.vibrate(VibrationEffect.createWaveform(
                              new long[]{0, 500, 200, 500}, 2
                          ));
                      } else {
                          vibrator.vibrate(new long[]{0, 500, 200, 500}, 2);
                      }
                  }
              }
              
              private void playSound(Context context) {
                  try {
                      Uri alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                      if (alarmUri == null) {
                          alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                      }
                      Ringtone ringtone = RingtoneManager.getRingtone(context, alarmUri);
                      if (ringtone != null) {
                          ringtone.play();
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Error al reproducir sonido: " + e.getMessage());
                  }
              }
          }
          EOF

      # 12. Crear BootReceiver.java
      - name: Create BootReceiver
        run: |
          cat > android/app/src/main/java/com/example/app/BootReceiver.java << 'EOF'
          package com.example.app;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.util.Log;
          
          public class BootReceiver extends BroadcastReceiver {
              private static final String TAG = "BootReceiver";
              private static final String PREF_NAME = "alarm_prefs";
              private static final String KEY_ALARM_TIME = "alarm_time";
              
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction()) ||
                      Intent.ACTION_QUICKBOOT_POWERON.equals(intent.getAction())) {
                      Log.d(TAG, "Dispositivo reiniciado - restaurando alarmas");
                      
                      // Restaurar alarmas desde SharedPreferences
                      SharedPreferences prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE);
                      long alarmTime = prefs.getLong(KEY_ALARM_TIME, 0);
                      
                      if (alarmTime > 0 && alarmTime > System.currentTimeMillis()) {
                          AlarmHelper.setAlarm(context, alarmTime);
                          Log.d(TAG, "Alarma restaurada para: " + alarmTime);
                      }
                  }
              }
          }
          EOF

      # 13. Crear AlarmService.java
      - name: Create AlarmService
        run: |
          cat > android/app/src/main/java/com/example/app/AlarmService.java << 'EOF'
          package com.example.app;
          
          import android.app.Notification;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.util.Log;
          
          import androidx.core.app.NotificationCompat;
          
          public cl
