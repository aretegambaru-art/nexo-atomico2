name: Build Android APK with Full Alarm Support

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NODE_VERSION: 20
  JAVA_VERSION: 17

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          # Verificar si existe package.json
          if [ ! -f "package.json" ]; then
            echo "Creando package.json básico..."
            cat > package.json << 'EOF'
          {
            "name": "alarm-app",
            "version": "1.0.0",
            "scripts": {
              "build": "echo 'Build web app'"
            },
            "dependencies": {
              "@capacitor/core": "^5.0.0",
              "@capacitor/android": "^5.0.0"
            },
            "devDependencies": {
              "typescript": "^5.0.0",
              "@capacitor/cli": "^5.0.0"
            }
          }
          EOF
          fi
          
          # Generar package-lock.json si no existe
          if [ ! -f "package-lock.json" ] && [ ! -f "npm-shrinkwrap.json" ] && [ ! -f "yarn.lock" ]; then
            echo "Generando package-lock.json..."
            npm install --package-lock-only
          fi
          
          # Instalar dependencias
          if [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          elif [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          
          # Instalar Capacitor si no está
          if ! npm list @capacitor/core @capacitor/cli @capacitor/android > /dev/null 2>&1; then
            echo "Instalando Capacitor..."
            npm install -D @capacitor/core @capacitor/cli @capacitor/android
          fi
          
          # Instalar TypeScript
          if ! npm list typescript > /dev/null 2>&1; then
            echo "Instalando TypeScript..."
            npm install -D typescript
          fi

      - name: Build web app
        run: |
          if [ -f "package.json" ]; then
            if npm run | grep -q " build$"; then
              npm run build
            elif npm run | grep -q " build:prod$"; then
              npm run build:prod
            else
              echo "No se encontró script de build. Creando dist/ vacío..."
              mkdir -p dist
              echo "<html><body><h1>Alarm App</h1></body></html>" > dist/index.html
            fi
          else
            echo "No se encontró package.json. Creando dist/ vacío..."
            mkdir -p dist
            echo "<html><body><h1>Alarm App</h1></body></html>" > dist/index.html
          fi
          
          if [ ! -d "dist" ]; then
            echo "Creando carpeta dist..."
            mkdir -p dist
            echo "<html><body><h1>Alarm App</h1></body></html>" > dist/index.html
          fi

      - name: Remove capacitor.config.ts if exists
        run: |
          if [ -f "capacitor.config.ts" ]; then
            echo "Eliminando capacitor.config.ts para evitar conflictos..."
            rm -f capacitor.config.ts
          fi

      - name: Create capacitor.config.json
        run: |
          echo "Creando capacitor.config.json..."
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.example.app",
            "appName": "Alarm App",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "scheme": "https",
              "hostname": "localhost"
            }
          }
          EOF
          
          echo "Contenido de capacitor.config.json:"
          cat capacitor.config.json

      - name: Sync Capacitor Android
        run: |
          # Verificar que capacitor.config.json existe
          if [ ! -f "capacitor.config.json" ]; then
            echo "ERROR: capacitor.config.json no existe"
            exit 1
          fi
          
          # Inicializar Capacitor si es necesario
          if [ ! -d "android" ]; then
            echo "Inicializando Capacitor para Android..."
            npx cap init Alarm App com.example.app --web-dir=dist
          fi
          
          # Agregar Android si no existe
          if [ ! -d "android" ]; then
            echo "Agregando plataforma Android..."
            npx cap add android
          fi
          
          # Sincronizar
          echo "Sincronizando Capacitor..."
          npx cap sync android --no-build

      - name: Create Java directories
        run: |
          mkdir -p android/app/src/main/java/com/example/app/
          mkdir -p android/app/src/main/res/values/
          mkdir -p android/app/src/main/res/raw/
          mkdir -p android/app/src/main/res/xml/

      - name: Configure AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.app">
          
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_ALARM" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">
          
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:launchMode="singleTask"
                      android:theme="@style/AppTheme.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <receiver android:name=".AlarmReceiver" android:exported="true" />
                  
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
          
                  <service 
                      android:name=".AlarmService" 
                      android:exported="false" 
                      android:foregroundServiceType="alarm" />
          
              </application>
          
          </manifest>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > android/app/src/main/java/com/example/app/MainActivity.java << 'EOF'
          package com.example.app;
          
          import android.Manifest;
          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.Log;
          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          
          public class MainActivity extends BridgeActivity {
              private static final String TAG = "MainActivity";
              private static final int REQUEST_CODE_PERMISSIONS = 1001;
              
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  createNotificationChannel();
                  checkAndRequestPermissions();
                  AlarmHelper.restoreAlarms(this);
              }
              
              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      NotificationChannel alarmChannel = new NotificationChannel(
                          "alarm_channel",
                          "Alarm Channel",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      alarmChannel.setDescription("Canal para notificaciones de alarmas");
                      alarmChannel.enableVibration(true);
                      alarmChannel.setVibrationPattern(new long[]{0, 1000, 500, 1000});
                      manager.createNotificationChannel(alarmChannel);
                      Log.d(TAG, "Canales de notificación creados");
                  }
              }
              
              private void checkAndRequestPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) 
                          != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, 
                              new String[]{Manifest.permission.POST_NOTIFICATIONS}, 
                              REQUEST_CODE_PERMISSIONS);
                      }
                  }
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      AlarmManager alarmManager = (AlarmManager) getSystemService(ALARM_SERVICE);
                      if (!alarmManager.canScheduleExactAlarms()) {
                          Intent intent = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM);
                          startActivity(intent);
                      }
                  }
              }
              
              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, 
                                                     @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  Log.d(TAG, "Resultado de permisos: " + requestCode);
              }
          }
          EOF

      - name: Create AlarmReceiver.java
        run: |
          cat > android/app/src/main/java/com/example/app/AlarmReceiver.java << 'EOF'
          package com.example.app;
          
          import android.app.Notification;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.Ringtone;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.util.Log;
          import androidx.core.app.NotificationCompat;
          
          public class AlarmReceiver extends BroadcastReceiver {
              private static final String TAG = "AlarmReceiver";
              private static final int NOTIFICATION_ID = 1001;
              
              @Override
              public void onReceive(Context context, Intent intent) {
                  Log.d(TAG, "Alarma recibida!");
                  
                  PowerManager powerManager = (PowerManager) context.getSystemService(Context.POWER_SERVICE);
                  PowerManager.WakeLock wakeLock = powerManager.newWakeLock(
                      PowerManager.PARTIAL_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP,
                      "AlarmWakeLock"
                  );
                  wakeLock.acquire(10 * 60 * 1000L);
                  
                  Intent serviceIntent = new Intent(context, AlarmService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.startForegroundService(serviceIntent);
                  } else {
                      context.startService(serviceIntent);
                  }
                  
                  showNotification(context);
                  vibrate(context);
                  playSound(context);
                  
                  new android.os.Handler().postDelayed(() -> {
                      if (wakeLock.isHeld()) {
                          wakeLock.release();
                      }
                  }, 5000);
              }
              
              private void showNotification(Context context) {
                  Intent intent = new Intent(context, MainActivity.class);
                  intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                  PendingIntent pendingIntent = PendingIntent.getActivity(
                      context, 0, intent, 
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
                  
                  Notification notification = new NotificationCompat.Builder(context, "alarm_channel")
                      .setContentTitle("Alarma")
                      .setContentText("¡Es hora de tu alarma!")
                      .setSmallIcon(android.R.drawable.ic_lock_alarm)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setFullScreenIntent(pendingIntent, true)
                      .setAutoCancel(true)
                      .build();
                  
                  NotificationManager manager = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  manager.notify(NOTIFICATION_ID, notification);
              }
              
              private void vibrate(Context context) {
                  Vibrator vibrator = (Vibrator) context.getSystemService(Context.VIBRATOR_SERVICE);
                  if (vibrator != null && vibrator.hasVibrator()) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator.vibrate(VibrationEffect.createWaveform(
                              new long[]{0, 500, 200, 500}, 2
                          ));
                      } else {
                          vibrator.vibrate(new long[]{0, 500, 200, 500}, 2);
                      }
                  }
              }
              
              private void playSound(Context context) {
                  try {
                      Uri alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                      if (alarmUri == null) {
                          alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                      }
                      Ringtone ringtone = RingtoneManager.getRingtone(context, alarmUri);
                      if (ringtone != null) {
                          ringtone.play();
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Error al reproducir sonido: " + e.getMessage());
                  }
              }
          }
          EOF

      - name: Create BootReceiver.java
        run: |
          cat > android/app/src/main/java/com/example/app/BootReceiver.java << 'EOF'
          package com.example.app;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.util.Log;
          
          public class BootReceiver extends BroadcastReceiver {
              private static final String TAG = "BootReceiver";
              private static final String PREF_NAME = "alarm_prefs";
              private static final String KEY_ALARM_TIME = "alarm_time";
              
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction()) ||
                      Intent.ACTION_QUICKBOOT_POWERON.equals(intent.getAction())) {
                      Log.d(TAG, "Dispositivo reiniciado - restaurando alarmas");
                      
                      SharedPreferences prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE);
                      long alarmTime = prefs.getLong(KEY_ALARM_TIME, 0);
                      
                      if (alarmTime > 0 && alarmTime > System.currentTimeMillis()) {
                          AlarmHelper.setAlarm(context, alarmTime);
                          Log.d(TAG, "Alarma restaurada para: " + alarmTime);
                      }
                  }
              }
          }
          EOF

      - name: Create AlarmService.java
        run: |
          cat > android/app/src/main/java/com/example/app/AlarmService.java << 'EOF'
          package com.example.app;
          
          import android.app.Notification;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.util.Log;
          import androidx.core.app.NotificationCompat;
          
          public class AlarmService extends Service {
              private static final String TAG = "AlarmService";
              private static final int NOTIFICATION_ID = 1002;
              
              @Override
              public void onCreate() {
                  super.onCreate();
                  Log.d(TAG, "AlarmService creado");
              }
              
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  Log.d(TAG, "AlarmService iniciado");
                  
          
